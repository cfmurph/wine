name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wineapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/wineapp
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations build from nothing and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Migrations reverse cleanly
        run: |
          alembic downgrade base
          alembic upgrade head
      - run: pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit --incremental false
      - run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start the staging stack from production images
        run: |
          cp deploy/staging.env.example deploy/staging.env
          scripts/deploy.sh staging
      - name: Load fixture data
        run: docker compose -p wine-staging --env-file deploy/staging.env -f docker-compose.prod.yml exec -T backend python3 - < e2e/seed_fixture.py
      - run: npm ci
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          E2E_WEB_URL: http://localhost:3100
          E2E_API_URL: http://localhost:8100/api/v1
      - name: Show service logs on failure
        if: failure()
        run: docker compose -p wine-staging --env-file deploy/staging.env -f docker-compose.prod.yml logs --tail 80

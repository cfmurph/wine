# Staging and production. Settings come from deploy/<environment>.env; see README "Deploying".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: &backend-build
      context: ./backend
      target: prod
    environment: &backend-env
      ENVIRONMENT: ${ENVIRONMENT:?}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      WINE_SEARCHER_API_KEY: ${WINE_SEARCHER_API_KEY:-}
      GLOBAL_WINE_SCORE_API_KEY: ${GLOBAL_WINE_SCORE_API_KEY:-}
      SPOONACULAR_API_KEY: ${SPOONACULAR_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build: *backend-build
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:?}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:?}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/advisors').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Started by scripts/deploy.sh. CI leaves these off, because it loads its own fixture data.
  scheduler:
    profiles: [scheduled]
    build: *backend-build
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - scheduler_state:/var/lib/wineapp
    command: ["python3", "scripts/scheduler.py"]

  backup:
    profiles: [scheduled]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - backups:/backups
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
    command: ["sh", "/backup_loop.sh"]

volumes:
  postgres_data:
  scheduler_state:
  backups:
